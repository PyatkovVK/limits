<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Limits</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../apple_feature/renderer/style.css">
  <link rel="stylesheet" href="../../linux_feature/renderer/style.css">
  <script src="i18n.js" defer></script>
  <script src="../../apple_feature/i18n.js" defer></script>
  <script src="../../apple_feature/renderer/notch.js" defer></script>
  <script src="countdown.js" defer></script>
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="sixty-seven.css">
  <script src="appearance.js" defer></script>
  <script src="renderer.js" defer></script>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
  <link rel="stylesheet" href="reset-notifications.css">
  <script src="reset-strings.js" defer></script>
  <script src="reset-notifications.js" defer></script>
  <link rel="stylesheet" href="updates.css">
  <script src="installer-updates.js" defer></script>
  <script src="updates.js" defer></script>
  <script src="../../linux_feature/renderer/settings.js" defer></script>
  <script src="../../linux_feature/renderer/panel.js" defer></script>
  <script src="../../apple_feature/renderer/panel.js" defer></script>
  <script src="../../apple_feature/renderer/accounts.js" defer></script>
  <script src="../../windows_feature/i18n.js" defer></script>
  <script src="../../windows_feature/renderer/panel.js" defer></script>
</head>
<body>
  <header class="titlebar"><div class="brand">Limits</div><select id="language" class="language" data-i18n-aria="language"><option value="ru">RU</option><option value="en">EN</option></select><span id="connection" class="connection">Подключение</span><button id="hide" class="icon-button" data-i18n-aria="close">×</button></header>
  <main>
    <div class="account-row"><span id="account">Подключаем аккаунт Codex…</span><span id="plan" class="plan" hidden></span></div>
    <div id="demo" class="notice" data-i18n="demoNotice" hidden></div>
    <div id="error" class="notice warning" role="status" hidden></div>
    <div id="bucket-row" hidden><label for="bucket" data-i18n="bucket"></label><select id="bucket"></select></div>
    <section class="quota-card short">
      <div class="quota-meta"><div class="period"><span data-i18n="short"></span> <time id="short-reset">—</time></div><span><span id="short-value" class="remaining-value">—</span>%</span></div>
      <progress id="short-bar" max="100" value="0" data-i18n-aria="short"></progress>
    </section>
    <section class="quota-card weekly">
      <div class="quota-meta"><div class="period" data-i18n="weekly"></div><span><span id="weekly-value" class="remaining-value">—</span>%</span></div>
      <progress id="weekly-bar" max="100" value="0" data-i18n-aria="weekly"></progress>
    </section>
    <div id="other" class="other" hidden></div>
    <div class="actions"><button id="refresh" class="refresh-button" data-i18n="refresh"></button><button id="login" class="login-button"></button></div>
    <footer><span class="live-dot"></span><span id="updated"></span></footer>
    <section class="accounts-section">
      <div class="accounts-heading"><span data-i18n="accounts"></span><button id="add-account" class="refresh-button" data-i18n="addAccount"></button></div>
      <div id="accounts"></div>
      <p class="footnote" data-i18n="accountsHint"></p>
    </section>
    <div class="display-settings"><label for="display-mode" data-i18n="displayMode"></label><select id="display-mode"><option value="widget" data-i18n="widgetMode"></option><option value="tray" data-i18n="trayMode"></option><option value="notch" data-i18n="notchMode" hidden disabled></option></select></div>
    <p id="display-hint" class="footnote"></p>
  </main>
</body>
</html>
