<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Limits</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="metrics.css">
  <link rel="stylesheet" href="../../apple_feature/renderer/style.css">
  <link rel="stylesheet" href="../../linux_feature/renderer/style.css">
  <script src="i18n.js" defer></script>
  <script src="../../apple_feature/i18n.js" defer></script>
  <script src="../../apple_feature/renderer/island.js" defer></script>
  <script src="../../apple_feature/renderer/surface.js" defer></script>
  <script src="../../apple_feature/renderer/notch.js" defer></script>
  <script src="countdown.js" defer></script>
  <script src="metrics.js" defer></script>
  <script src="metric-elements.js" defer></script>
  <script src="../../windows_feature/panel/reset-clock.js" defer></script>
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="sixty-seven.css">
  <script src="appearance.js" defer></script>
  <script src="../../linux_feature/renderer/settings.js" defer></script>
  <link rel="stylesheet" href="key-connection.css">
  <script src="key-connection.js" defer></script>
  <link rel="stylesheet" href="../settings/common/style.css">
  <script src="../settings/common/group.js" defer></script>
  <script src="../settings/general/group.js" defer></script>
  <script src="../../windows_feature/panel/widget-style.js" defer></script>
  <script src="../../windows_feature/panel/widget-settings.js" defer></script>
  <script src="../settings/common/dialog.js" defer></script>
  <link rel="stylesheet" href="../settings/subscriptions/style.css">
  <script src="../settings/subscriptions/group.js" defer></script>
  <script src="renderer.js" defer></script>
  <link rel="stylesheet" href="../settings/background/style.css">
  <script src="../settings/background/group.js" defer></script>
  <link rel="stylesheet" href="../settings/resets/style.css">
  <script src="../settings/resets/strings.js" defer></script>
  <script src="../settings/resets/group.js" defer></script>
  <link rel="stylesheet" href="../settings/updates/style.css">
  <script src="../settings/updates/installation.js" defer></script>
  <script src="../settings/updates/group.js" defer></script>
  <script src="../../linux_feature/renderer/panel.js" defer></script>
  <script src="../../apple_feature/renderer/panel.js" defer></script>
  <script src="../../windows_feature/i18n.js" defer></script>
  <script src="../../windows_feature/panel/panel.js" defer></script>
</head>
<body>
  <header class="titlebar"><div class="brand">Limits</div><span id="connection" class="connection">Подключение</span><button id="hide" class="icon-button" data-i18n-aria="close">×</button></header>
  <main>
    <div class="account-row"><span id="account">Подключаем аккаунт Codex…</span><span id="plan" class="plan" hidden></span></div>
    <div id="demo" class="notice" data-i18n="demoNotice" hidden></div>
    <div id="error" class="notice warning" role="status" hidden></div>
    <div id="bucket-row" hidden><label for="bucket" data-i18n="bucket"></label><select id="bucket"></select></div>
    <div class="panel-quotas">
      <div class="panel-quota-heading"><strong>Limits</strong><span id="panel-provider"></span></div>
      <section class="quota-card short">
        <div class="quota-meta"><div class="period"><span data-i18n="short"></span><span class="panel-quota-period" data-i18n="shortCompact"></span> <time id="short-reset">—</time></div><span class="quota-amount"><span id="short-value" class="remaining-value">—</span><span id="short-unit" hidden>%</span></span></div>
        <progress id="short-bar" max="100" value="0" data-i18n-aria="short"></progress>
      </section>
      <section class="quota-card weekly">
        <div class="quota-meta"><div class="period"><span data-i18n="weekly"></span><span class="panel-quota-period" data-i18n="weeklyDays"></span> <time id="weekly-reset" hidden></time></div><span class="quota-amount"><span id="weekly-value" class="remaining-value">—</span><span id="weekly-unit" hidden>%</span></span></div>
        <progress id="weekly-bar" max="100" value="0" data-i18n-aria="weekly"></progress>
      </section>
    </div>
    <div id="other" class="other" hidden></div>
    <section id="provider-metrics" class="provider-metrics" hidden></section>
    <div class="actions"><button id="refresh" class="refresh-button" data-i18n="refresh"></button><button id="login" class="login-button"></button></div>
    <footer><span class="live-dot"></span><span id="updated"></span></footer>
    <section class="accounts-section settings-group" aria-labelledby="subscriptions-title">
      <div class="accounts-heading">
        <h3 id="subscriptions-title"></h3>
        <button id="add-account" class="subscription-button" type="button" popovertarget="subscription-providers" data-i18n="addAccount" disabled></button>
        <div id="subscription-providers" popover role="group" aria-labelledby="add-account"></div>
      </div>
      <div class="settings-group-card">
        <div class="subscription-controls settings-item">
          <label id="subscription-source"></label>
          <span class="settings-item-select"><select></select></span>
        </div>
        <div id="accounts"></div>
        <p class="subscription-empty" hidden></p>
      </div>
      <p class="subscription-error settings-item-error" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
