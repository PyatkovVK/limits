<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Codex — панель задач</title><link rel="stylesheet" href="widget.css"><script src="widget.js" defer></script></head>
<body>
  <div class="account" title="Перетащите аккаунт, чтобы передвинуть блок по панели задач"><span id="widget-account">Подключение…</span><span id="widget-plan">CODEX</span><span id="widget-status">Получаем лимиты</span></div>
  <button class="quotas" id="details" title="Открыть подробности лимитов">
    <div class="quota"><div class="line"><strong>Пятичасовой лимит</strong><span id="short-reset">До сброса: —</span><span class="remaining">Осталось <span id="short-value">—</span>%</span></div><progress id="short-bar" max="100" value="0" aria-label="Остаток за пять часов"></progress></div>
    <div class="quota"><div class="line"><strong>Недельный лимит</strong><span id="weekly-reset">До сброса: —</span><span class="remaining">Осталось <span id="weekly-value">—</span>%</span></div><progress id="weekly-bar" max="100" value="0" aria-label="Остаток за неделю"></progress></div>
  </button>
</body></html>
