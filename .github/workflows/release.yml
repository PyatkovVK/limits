name: Test, build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-branch:
    name: Select branch pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.branch.outputs.check }}
      build: ${{ steps.branch.outputs.build }}
      publish: ${{ steps.branch.outputs.publish }}
      branch: ${{ steps.branch.outputs.branch }}
      version: ${{ steps.branch.outputs.version }}
      tag: ${{ steps.branch.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        id: branch
        with:
          script: require('./scripts/ci/route.cjs').route({ context, core })

  check:
    needs: check-branch
    if: needs.check-branch.outputs.check == 'true'
    uses: ./.github/workflows/ci-tests.yml

  build:
    needs: check-branch
    if: needs.check-branch.outputs.build == 'true'
    uses: ./.github/workflows/ci-build.yml
    with:
      version: ${{ needs.check-branch.outputs.version }}
      sign: ${{ needs.check-branch.outputs.publish == 'true' }}
    secrets: inherit

  verify:
    needs: [check-branch, build]
    uses: ./.github/workflows/ci-verify.yml
    with:
      version: ${{ needs.check-branch.outputs.version }}

  publish:
    needs: [check-branch, verify]
    if: needs.check-branch.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/ci-publish.yml
    with:
      branch: ${{ needs.check-branch.outputs.branch }}
      tag: ${{ needs.check-branch.outputs.tag }}
