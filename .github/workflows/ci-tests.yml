name: Tests
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-15
            target: mac
          - os: ubuntu-24.04
            target: linux
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run common tests
        run: npm run test:common
      - name: Run platform tests
        run: npm run test:${{ matrix.target }}
